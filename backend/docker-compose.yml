version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jdb_trading}
      POSTGRES_USER: ${DB_USER:-jdb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jdb_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdb-network

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdb-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jdb_trading}
      DB_USER: ${DB_USER:-jdb_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme123}
      ML_SERVICE_URL: http://ml-service:5000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - jdb-network

  # ML Service (Python)
  ml-service:
    build:
      context: ../ml_service
      dockerfile: Dockerfile
    container_name: jdb-ml-service
    restart: unless-stopped
    ports:
      - "${ML_PORT:-5000}:5000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000
      DEBUG: ${ML_DEBUG:-False}
      MODEL_VERSION: v1
    volumes:
      - ml_data:/app/data
      - ml_models:/app/models
      - ml_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - jdb-network

networks:
  jdb-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ml_data:
    driver: local
  ml_models:
    driver: local
  ml_logs:
    driver: local
