version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jdb_trading}
      POSTGRES_USER: ${DB_USER:-jdb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jdb_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jdb-network

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdb-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jdb_trading}
      DB_USER: ${DB_USER:-jdb_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme123}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - jdb-network

networks:
  jdb-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
