spring:
  application:
    name: jdb-trading-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jdb_trading}
    username: ${DB_USER:jdb_user}
    password: ${DB_PASSWORD:changeme123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0

server:
  port: 8080

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  max-age: 3600

# Yahoo Finance Configuration
yahoo-finance:
  cache-duration-seconds: 300  # 5 minutes
  retry-attempts: 3
  retry-delay-ms: 1000

# ML Service Configuration
ml-service:
  url: ${ML_SERVICE_URL:http://localhost:5000}
  enabled: ${ML_SERVICE_ENABLED:true}
  timeout-ms: 10000  # 10 seconds

# Logging
logging:
  level:
    root: INFO
    com.jdb.trading: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
